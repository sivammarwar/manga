# .github/workflows/mangaforge.yml
#
# MangaForge AI — Autonomous Pipeline
#
# Schedule (IST = UTC+5:30):
#   Monday     6:00 AM IST → Full pipeline (ideation + outlines + writing + images + publish)
#   Every day  8:00 AM IST → Daily chapter publisher (drip-publishes scheduled chapters)
#
# Secrets required:
#   GEMINI_API_KEY, SUPABASE_URL, SUPABASE_KEY
#   HF_API_TOKEN_1, HF_API_TOKEN_2, HF_API_TOKEN_3, HF_API_TOKEN_4  (rotate on rate limit)
#   R2_ENDPOINT_URL, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL

name: MangaForge Autonomous Pipeline

on:
  schedule:
    # Monday 6:00 AM IST = Monday 00:30 UTC
    - cron: '30 0 * * 1'
    # Every day 8:00 AM IST = 02:30 UTC (publisher)
    - cron: '30 2 * * *'

  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually?'
        required: true
        default: 'publisher'
        type: choice
        options:
          - full_pipeline
          - publisher

env:
  GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
  SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
  # 4-token HF rotation — add as separate secrets in GitHub repo settings
  HF_API_TOKEN_1:       ${{ secrets.HF_API_TOKEN_1 }}
  HF_API_TOKEN_2:       ${{ secrets.HF_API_TOKEN_2 }}
  HF_API_TOKEN_3:       ${{ secrets.HF_API_TOKEN_3 }}
  HF_API_TOKEN_4:       ${{ secrets.HF_API_TOKEN_4 }}
  # Fallback: old single-token secret still works
  HF_API_TOKEN:         ${{ secrets.HF_API_TOKEN }}
  R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
  R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
  R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}

jobs:

  # ── Job 1: Full Pipeline (every Monday 6AM IST) ──────────────────────────────
  full_pipeline:
    name: Full Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 180   # pipeline + images can take up to 3 hrs for 10 series × 21 chapters × 3 images
    if: |
      github.event.schedule == '30 0 * * 1' ||
      github.event.inputs.job == 'full_pipeline'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'mangaforge-backend/requirements.txt'

      - name: Install dependencies
        run: |
          cd mangaforge-backend
          pip install -r requirements.txt

      - name: Run full pipeline
        run: |
          cd mangaforge-backend
          python pipeline.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: mangaforge-backend/*.log
          retention-days: 14

  # ── Job 2: Daily Publisher (every day 8AM IST) ───────────────────────────────
  publisher:
    name: Daily Publisher
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event.schedule == '30 2 * * *' ||
      github.event.inputs.job == 'publisher'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase python-dotenv

      - name: Run publisher
        run: |
          cd mangaforge-backend
          python publisher.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-logs-${{ github.run_id }}
          path: mangaforge-backend/*.log
          retention-days: 7